<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 100 100">
<defs>
<linearGradient id="blossomPetal" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#FFF0F2"></stop><stop offset="50%" stop-color="#FFB3B1"></stop><stop offset="100%" stop-color="#E57373"></stop></linearGradient>
<linearGradient id="terracottaGold" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#FFE5B4"></stop><stop offset="50%" stop-color="#D4AF37"></stop><stop offset="100%" stop-color="#A5393E"></stop></linearGradient>
</defs>
<!-- 5 carved ceramic petals -->
<g stroke="url(#terracottaGold)" stroke-width="2.5">
<circle cx="50" cy="28" fill="url(#blossomPetal)" r="17"></circle>
<circle cx="71" cy="43" fill="url(#blossomPetal)" r="17"></circle>
<circle cx="63" cy="70" fill="url(#blossomPetal)" r="17"></circle>
<circle cx="37" cy="70" fill="url(#blossomPetal)" r="17"></circle>
<circle cx="29" cy="43" fill="url(#blossomPetal)" r="17"></circle>
</g>
<!-- Inner sculpted blossom heart -->
<circle cx="50" cy="50" fill="#A5393E" r="14" stroke="#FFE5B4" stroke-width="2"></circle>
<circle cx="50" cy="50" fill="#FFE5B4" r="7"></circle>
<!-- Stamens -->
<circle cx="45" cy="47" fill="#FFFFFF" r="1.5"></circle>
<circle cx="55" cy="47" fill="#FFFFFF" r="1.5"></circle>
<circle cx="50" cy="54" fill="#FFFFFF" r="1.5"></circle>
</svg>
